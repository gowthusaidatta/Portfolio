name: CI - Build & Lighthouse

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Serve `dist` and run Lighthouse
        env:
          CI: true
        run: |
          npm install -g http-server
          npx http-server ./dist -p 8080 &
          # wait for server
          npx wait-on http://localhost:8080
          npx -y lighthouse http://localhost:8080 --output html --output-path ./lighthouse-report.html --chrome-flags="--no-sandbox --headless"

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.html
